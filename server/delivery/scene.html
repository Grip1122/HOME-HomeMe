<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HOME 资源预览</title><style>*{box-sizing:border-box}html,body{height:100%;margin:0;background:#1a292d;color:#dce6e4;font:12px system-ui}canvas{display:block;width:100%;height:100%;touch-action:none}.bar{position:absolute;top:18px;left:20px;right:20px;display:flex;justify-content:space-between;gap:16px;pointer-events:none}.controls{position:absolute;bottom:18px;left:20px;right:20px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}input{accent-color:#d4b46e}button{border:1px solid #5b7379;color:#dce6e4;background:#13272bcc;border-radius:5px;padding:7px 14px;cursor:pointer}#message{position:absolute;left:24px;top:60px;color:#ebc689}.note{color:#c5d0d1;text-shadow:0 1px 3px #111}</style></head><body><canvas id="scene"></canvas><div class="bar"><span>HOME · 小觅 / TEAM SCENE</span><span>固定 45° 正交预览 · 滚轮缩放</span></div><div id="message">正在加载团队场景和机器人…</div><div class="controls"><label>杆高 <input id="height" type="range" min=".55" max="2.3" value=".75" step=".01"></label><label>俯仰 <input id="tilt" type="range" min="-37" max="37" value="0" step="1"></label><button id="focus">机器人近景</button><span class="note">视觉资源预览；不作为已标定导航或抓取验收结果。</span></div><script type="module" src="./scene-preview.mjs"></script></body></html>
