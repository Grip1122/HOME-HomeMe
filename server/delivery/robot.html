<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HOME / 小觅 · 机器人资源预览</title>
<style>body{margin:0;background:#101a20;color:#edf3f0;font:16px system-ui}header{padding:20px}main{height:70vh}canvas{display:block;width:100%;height:100%}label{margin-right:24px}#error{color:#ffc786;white-space:pre-wrap}a{color:#a5e3cb}</style>
<header><h1>HOME / 小觅 · RS-01</h1><p>独立资源预览 · 四节伸缩杆与云台；正式动作由 A 接入</p><label>相机高度 <input id="height" type="range" min="0.55" max="2.3" step="0.01" value="1.15"></label><label>俯仰 <input id="tilt" type="range" min="-0.65" max="0.65" step="0.01" value="0"></label><a href="./README.md">交接说明</a><pre id="error" role="status">加载中；若长时间未完成，请从项目根目录运行 npm --prefix web ci，并检查 assets/robot/ 资源。</pre></header><main><canvas id="robot"></canvas></main>
<script type="importmap">{"imports":{"three":"/web/node_modules/three/build/three.module.js","three/addons/":"/web/node_modules/three/examples/jsm/"}}</script>
<script type="module">
const error=document.getElementById('error');
try {
 const THREE=await import('three');
 const [{GLTFLoader},{OrbitControls},kin]=await Promise.all([import('three/addons/loaders/GLTFLoader.js'),import('three/addons/controls/OrbitControls.js'),import('/web/src/robot/kinematics.js')]);
 const manifestResponse=await fetch('/assets/robot/manifest.json');if(!manifestResponse.ok)throw Error('缺少 /assets/robot/manifest.json');await manifestResponse.json();
 const model=await new GLTFLoader().loadAsync('/assets/robot/roomscan-rs01.glb');
 const scene=new THREE.Scene();scene.background=new THREE.Color('#101a20');scene.add(model.scene);
 const renderer=new THREE.WebGLRenderer({canvas:document.getElementById('robot'),antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
 const camera=new THREE.PerspectiveCamera(40,1,.01,30);camera.position.set(2,1.7,2);const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,1,0);controls.update();
 scene.add(new THREE.HemisphereLight(0xe6f7ff,0x505045,3));const light=new THREE.DirectionalLight(0xffe4be,4);light.position.set(3,5,2);scene.add(light);
 const stages=Array.from({length:4},(_,i)=>model.scene.getObjectByName(`MastStage${i+1}`));const head=model.scene.getObjectByName('CameraHead');if(stages.some(s=>!s)||!head)throw Error('GLB 缺少伸缩杆或相机节点');
 function pose(){const mast=kin.mastStageOffsets(Number(document.getElementById('height').value));stages.forEach((stage,i)=>stage.position.y=mast.localY[i]);head.rotation.z=-kin.clampTilt(Number(document.getElementById('tilt').value));model.scene.updateMatrixWorld(true);window.homeRobotPreview={height:mast.height,head:head.getWorldPosition(new THREE.Vector3()).toArray(),stages:stages.length};}
 document.getElementById('height').oninput=pose;document.getElementById('tilt').oninput=pose;pose();
 new ResizeObserver(()=>{const rect=renderer.domElement.parentElement.getBoundingClientRect();renderer.setSize(rect.width,rect.height,false);camera.aspect=rect.width/rect.height;camera.updateProjectionMatrix();}).observe(renderer.domElement.parentElement);
 renderer.setAnimationLoop(()=>renderer.render(scene,camera));error.textContent='资源已加载；拖动旋转、滚轮缩放';document.body.dataset.loaded='yes';
} catch(e){error.textContent='机器人预览无法加载：'+e.message+'\n请确认 npm --prefix web ci 已完成，assets/robot/roomscan-rs01.glb 存在，并通过项目根目录的 HTTP 服务访问。';document.body.dataset.error=e.message;}
</script></html>
