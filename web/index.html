<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" href="data:," />
  <title>小觅HOME · 餐厅任务演示</title>
  <meta name="description" content="小觅HOME：在餐厅虚拟空间中完成自然语言规划、机器人执行与任务日志记录。" />
  <style>
  :root { color-scheme: dark; font-family: "Microsoft YaHei", system-ui, sans-serif; }
  html, body { margin: 0; height: 100%; background: #070b11; overflow: hidden; }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #restaurant-live { position: fixed; inset: 0; z-index: 1; }
  #restaurant-live canvas { width: 100% !important; height: 100% !important; display: block; }
  #scene { z-index: 2; pointer-events: none; }
  #appbar, #ops, #banner, #fatal { z-index: 4; }
  #appbar { position: fixed; z-index: 40; top: 18px; left: 24px; right: 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px; pointer-events: none; }
  .brand { pointer-events: auto; color: #edf8f7; display: flex; flex-direction: column; gap: 2px; text-shadow: 0 1px 16px #071015; }
  .brand strong { font-size: 16px; letter-spacing: 0; }
  .brand span { font-size: 12px; color: #a9c6c2; }
  .app-actions { pointer-events: auto; display: flex; gap: 8px; align-items: center; }
  button { font: inherit; }
  .app-actions button, #ops button { padding: 7px 11px; border-radius: 6px; border: 1px solid #3c6f69; background: #102521e8; color: #e8f7f3; cursor: pointer; font-size: 12px; }
  .app-actions button:hover, #ops button:hover { background: #1a3832; }
  #ops { position: fixed; right: 24px; bottom: 24px; z-index: 40; display: flex; gap: 8px; align-items: center; }
  #ops button:disabled { opacity: .45; cursor: default; }
  #banner { position: fixed; left: 50%; top: 82px; transform: translateX(-50%); z-index: 41; padding: 8px 14px; border-radius: 6px; font-size: 12px; display: none; max-width: 70vw; }
  #banner.err { display: block; background: #a84138; color: #fff; }
  #banner.ok { display: block; background: #28785a; color: #fff; }
  #banner button { margin-left: 10px; }
  #fatal { position: fixed; inset: 0; z-index: 99; background: #200; color: #fff; padding: 40px; white-space: pre-wrap; display: none; }
  @media (max-width: 700px) { #appbar { left: 12px; right: 12px; top: 12px; } .brand span { display: none; } #ops { right: 12px; bottom: 12px; } .app-actions button { padding: 7px 8px; } }
  </style>
</head>
<body>
<div id="restaurant-live" aria-label="餐厅高斯溅射实景"></div>
<canvas id="scene"></canvas>
<header id="appbar">
  <div class="brand"><strong>小觅HOME</strong><span>餐厅虚拟场景 · 自然语言任务演示</span></div>
  <nav class="app-actions" aria-label="产品导航">
    <button id="btn-experience" type="button">空间记忆体验</button>
    <button id="btn-health" type="button">服务状态</button>
  </nav>
</header>
<div id="ops">
  <button id="btn-cancel" type="button" disabled>取消当前任务</button>
  <button id="btn-fail" type="button">演示：执行失败</button>
</div>
<div id="banner"></div>
<pre id="fatal"></pre>
<script src="/robot-find/vendor/three.min.js"></script>
<script src="/robot-find/vendor/gaussian-splats-3d.umd.js"></script>
<script type="module" src="/src/product/main.js"></script>
</body>
</html>
