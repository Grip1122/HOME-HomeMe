name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-gate:
    name: 契约闸门（第一关）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 契约与 lock 一致、不混提交
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python scripts/check_contracts.py --base origin/${{ github.base_ref }}
          else
            python scripts/check_contracts.py
          fi
      - name: contracts/ 改动必须是 [CONTRACT] PR
        if: github.event_name == 'pull_request'
        run: |
          changed=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- contracts/ | grep -v 'contracts.lock.json' | grep -v 'CHANGELOG.md' || true)
          title='${{ github.event.pull_request.title }}'
          if [ -n "$changed" ] && ! echo "$title" | grep -q '^\[CONTRACT\]'; then
            echo "::error::PR 改动了 contracts/ ($changed)，标题必须以 [CONTRACT] 开头"
            exit 1
          fi

  backend:
    name: 后端测试
    runs-on: ubuntu-latest
    needs: contract-gate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: server/requirements.txt
      - run: pip install -r server/requirements.txt
      - name: 布局静态检查
        run: python scripts/check_layout.py
      - name: pytest
        run: python -m pytest

  mutation:
    name: 变异验证（测试必须能变红）
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: server/requirements.txt
      - run: pip install -r server/requirements.txt
      - run: python scripts/mutation_demo.py

  frontend:
    name: 前端测试
    runs-on: ubuntu-latest
    needs: contract-gate
    steps:
      - uses: actions/checkout@v4
      - name: 前端尚未初始化则跳过
        id: has_web
        run: |
          if [ -f web/package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.has_web.outputs.present == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - if: steps.has_web.outputs.present == 'true'
        working-directory: web
        run: npm ci && npm test --if-present && npm run build --if-present
